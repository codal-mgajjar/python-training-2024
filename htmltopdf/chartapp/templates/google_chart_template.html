<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table with Google Chart to PDF Example</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body onload="generateContent()">
    <!-- Table element to hold the data -->
    <table id="myTable">
        <thead>
            <tr>
                <th>Month</th>
                <th>Sales</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td><input type="number" id="januarySales" value="100"></td>
            </tr>
            <tr>
                <td>February</td>
                <td><input type="number" id="februarySales" value="150"></td>
            </tr>
            <tr>
                <td>March</td>
                <td><input type="number" id="marchSales" value="200"></td>
            </tr>
            <tr>
                <td>April</td>
                <td><input type="number" id="aprilSales" value="120"></td>
            </tr>
            <tr>
                <td>May</td>
                <td><input type="number" id="maySales" value="180"></td>
            </tr>
        </tbody>
    </table>

    <!-- Google Chart -->
    <div id="googlePieChart" style="width: 400px; height: 400px;"></div>

    <!-- Form to generate PDF -->
    <form id="pdfForm" action="{% url 'pdf' %}" method="post">
        {% csrf_token %}
        <input type="submit" value="PDF" formtarget="_blank"/>
    </form>

    <script type="text/javascript">
        var form;  // Declare form variable in the global scope

        function generateContent() {
            // Assign the form variable inside the function
            form = document.getElementById('pdfForm');

            // Load the Google Charts library
            google.charts.load('current', {'packages':['corechart']});

            // Set a callback to run when the Google Charts library is loaded
            google.charts.setOnLoadCallback(drawChart);

            // Add event listener to the form submission
            form.addEventListener('submit', function(event) {
                // Prevent the default form submission
                event.preventDefault();

                // Update the chart data with the new sales values
                updateChartData();

                // Get the HTML content of the table and Google Chart
                var tableHtml = document.getElementById('myTable').outerHTML;
                var googleChartSvg = document.getElementById('googlePieChart').innerHTML;

                // Convert the Google Chart HTML content to SVG
                convertToSVG(googleChartSvg);
            });
        }

        function drawChart() {
            // Create a data table with the default sales data
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Month');
            data.addColumn('number', 'Sales');
            data.addRows([
                ['January', 100],
                ['February', 150],
                ['March', 200],
                ['April', 120],
                ['May', 180]
            ]);

            // Set chart options
            var options = {
                title: 'Sales Data',
                pieHole: 0.4,
                width: 400,
                height: 400
            };

            // Instantiate and draw the chart
            var chart = new google.visualization.PieChart(document.getElementById('googlePieChart'));
            chart.draw(data, options);
        }

        function updateChartData() {
            // Get the input values and update the chart data
            var januarySales = parseFloat(document.getElementById('januarySales').value);
            var februarySales = parseFloat(document.getElementById('februarySales').value);
            var marchSales = parseFloat(document.getElementById('marchSales').value);
            var aprilSales = parseFloat(document.getElementById('aprilSales').value);
            var maySales = parseFloat(document.getElementById('maySales').value);

            // Create a data table with the updated sales data
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Month');
            data.addColumn('number', 'Sales');
            data.addRows([
                ['January', januarySales],
                ['February', februarySales],
                ['March', marchSales],
                ['April', aprilSales],
                ['May', maySales]
            ]);

            // Redraw the chart with the updated data
            var options = {
                title: 'Sales Data',
                pieHole: 0.4,
                width: 400,
                height: 400
            };

            var chart = new google.visualization.PieChart(document.getElementById('googlePieChart'));
            chart.draw(data, options);
        }

        function convertToSVG(googleChartSvg) {
            // Combine Google Chart SVG
            var combinedSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
                                <foreignObject width="100%" height="100%">
                                    <div xmlns="http://www.w3.org/1999/xhtml">
                                        ${googleChartSvg}
                                    </div>
                                </foreignObject>
                              </svg>`;

            // Add a hidden input field to the form and set its value to the combined SVG data
            var hiddenInput = document.createElement('input');
            hiddenInput.type = 'hidden';
            hiddenInput.name = 'combinedSvg';
            hiddenInput.value = combinedSvg;
            form.appendChild(hiddenInput);

            // Submit the form
            form.submit();
        }
    </script>
</body>
</html>
